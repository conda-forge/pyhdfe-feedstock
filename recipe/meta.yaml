{% set name = "pyhdfe" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fa625e517c62d4e171ce4a5a9a6018c231d8a30702bdabe94f01f6cee34dad4e

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.17
    - scipy >=1.0
test:
  imports:
    - pyhdfe
    - pyhdfe.algorithms
    - pyhdfe.interface
    - pyhdfe.utilities
    - pyhdfe.version
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/jeffgortmaker/pyhdfe
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Algorithms for absorbing high dimensional fixed effects.
  doc_url: https://pyhdfe.readthedocs.io/
  dev_url: https://github.com/jeffgortmaker/pyhdfe

extra:
  recipe-maintainers:
    - bashtage
